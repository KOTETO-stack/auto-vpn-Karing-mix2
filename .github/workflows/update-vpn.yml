name: Auto Update VPN Configs

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests aiohttp pyyaml pynacl
      - run: python scripts/collect_and_filter.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update VPN configs + WARP+ $(date -u +%Y-%m-%d_%H:%M)"
          git push
