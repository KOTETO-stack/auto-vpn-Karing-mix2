name: Auto Update VPN Configs

on:
  schedule:
    - cron: '0 * * * *'  # Каждый час
  workflow_dispatch:  # Ручной запуск

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install requests aiohttp asyncio python-geoip
          
      - name: Run collector
        run: python scripts/collect_and_filter.py
        
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update VPN configs $(date -u +%Y-%m-%d_%H:%M)"
          git push
