name: Auto Update VPN Subscription

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install requests pycryptodome
          
      - name: Update sources
        run: python source_manager.py
          
      - name: Build subscription
        run: python main_builder.py
          
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fetch_sources.json subscription.txt subscription_encrypted.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: update subscription $(date +%Y-%m-%d-%H:%M)"
          git push
