name: VPN Subscription Auto-Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install deps
        run: pip install aiohttp aiofiles cryptography
      
      - name: Run updater
        env:
          WARP_PRIVATE_KEY: ${{ secrets.WARP_PRIVATE_KEY }}
          WARP_RESERVED: ${{ secrets.WARP_RESERVED }}
          SUB_PASSWORD: ${{ secrets.SUB_PASSWORD }}
        run: python src/main.py
      
      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update: ${{ github.run_id }}"
          file_pattern: 'output/*'
          push_options: '--force-with-lease'
