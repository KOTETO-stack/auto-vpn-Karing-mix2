name: Auto Update VPN Configs

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/warp_generator.py
        env:
          WARP_LICENSE: ${{ secrets.WARP_LICENSE }}
      - run: python scripts/amnezia_fetcher.py
      - run: python scripts/fetch_proxies.py
      - run: python scripts/build_final.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto update: $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push
